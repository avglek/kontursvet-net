# ============================================================
# reverse-proxy nginx для КонтурСвет
#   /          → Nuxt (web:3000), включая WebSocket для HMR в dev
#   /api/**    → .NET API (api:5136)
#   /health    → .NET API
#   /swagger   → .NET API (доступен, когда API в Development)
#   /uploads/**→ общая папка загрузок (volume /data) со статикой и кэшем
# Монтируется в образ как /etc/nginx/conf.d/default.conf
# ============================================================

# Поддержка WebSocket (нужна для HMR dev-сервера Nuxt)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api_upstream {
    server api:5136;
}

upstream web_upstream {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # Загрузка фотографий размером до 50 МБ
    client_max_body_size 50m;

    # Общая папка загрузок/статики — отдаём напрямую с смонтированного volume'а.
    # Файлы пишет API в /data/uploads (Storage:LocalRoot=/data).
    location /uploads/ {
        alias /data/uploads/;
        # Один заголовок Cache-Control: expires сам бы добавил второй max-age
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API бэкенда
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проверка живости
    location = /health {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    # Swagger UI (только когда API запущен в Development)
    location /swagger {
        proxy_pass http://api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nuxt: SSR + статика ассетов + HMR по WebSocket (dev)
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
