# ============================================================
# ПРОД: готовые образы api + web за reverse-proxy nginx.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ============================================================
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    image: kontursvet-net-api:prod
    container_name: kontursvet-net-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5136
      Storage__LocalRoot: /data
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-kontursvet};Username=${POSTGRES_USER:-kontursvet};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      Jwt__Issuer: ${JWT_ISSUER:-kontursvet}
      Jwt__Audience: ${JWT_AUDIENCE:-kontursvet-admin}
      Max__Token: ${MAX_TOKEN:?MAX_TOKEN must be set in .env}
      Max__ChatId: ${MAX_CHAT_ID:?MAX_CHAT_ID must be set in .env}
    volumes:
      - uploads:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kontursvet-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runtime
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
        # Значение по умолчанию для runtimeConfig внутри образа
        NUXT_PUBLIC_YANDEX_METRIKA_ID: ${NUXT_PUBLIC_YANDEX_METRIKA_ID:-}
    image: kontursvet-net-web:prod
    container_name: kontursvet-net-web
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
      # ID счётчика Яндекс Метрики (пусто — метрика отключена)
      NUXT_PUBLIC_YANDEX_METRIKA_ID: ${NUXT_PUBLIC_YANDEX_METRIKA_ID:-}
      NUXT_API_INTERNAL_BASE: http://api:5136
      NUXT_PUBLIC_PRIVACY_FIO: ${NUXT_PUBLIC_PRIVACY_FIO:-}
      NUXT_PUBLIC_PRIVACY_INN: ${NUXT_PUBLIC_PRIVACY_INN:-}
      NUXT_PUBLIC_PRIVACY_OGRNIP: ${NUXT_PUBLIC_PRIVACY_OGRNIP:-}
      NUXT_PUBLIC_PRIVACY_EMAIL: ${NUXT_PUBLIC_PRIVACY_EMAIL:-}
      HOST: 0.0.0.0
      PORT: '3000'
    depends_on:
      - api
    networks:
      - kontursvet-net

  nginx:
    image: nginx:1.27-alpine
    container_name: kontursvet-net-nginx
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Отдаёт общую папку загрузок напрямую (только чтение)
      - uploads:/data:ro
    depends_on:
      - api
      - web
    networks:
      - kontursvet-net

  postgres:
    image: postgres:16-alpine
    container_name: kontursvet-net-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kontursvet}
      POSTGRES_USER: ${POSTGRES_USER:-kontursvet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Миграции применяются при первой инициализации тома
      - ./src/Kontursvet.Infrastructure/Migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-kontursvet} -d ${POSTGRES_DB:-kontursvet}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kontursvet-net

volumes:
  pgdata:
  # Общая папка загрузок/статики: пишет API, раздаёт nginx
  uploads:

networks:
  kontursvet-net:
    driver: bridge
